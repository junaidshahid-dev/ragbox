[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbox"
version = "1.0.0"
description = "Document Q&A with citations (RAG): FastAPI service, pluggable retrieval and answering"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "M. Junaid Shahid", email = "junaidshahid725@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "PyMuPDF>=1.24",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6"]
llm = ["anthropic>=0.25"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["ragbox"]
